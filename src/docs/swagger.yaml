openapi: 3.0.3
info:
  title: Memoria Ancestral API
  version: 1.0.0
  description: Estrutura inicial de API REST com autenticação JWT e MongoDB.
servers:
  - url: http://localhost:3000
tags:
  - name: Health
  - name: Auth
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Verifica se a API está ativa
      responses:
        "200":
          description: API ativa
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Registra um novo usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  example: Maria Silva
                email:
                  type: string
                  format: email
                  example: maria@email.com
                password:
                  type: string
                  format: password
                  example: 123456
      responses:
        "201":
          description: Usuário criado
        "400":
          description: Dados inválidos
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Autentica usuário e retorna token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login realizado
        "401":
          description: Credenciais inválidas
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Retorna os dados do usuário autenticado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuário autenticado
        "401":
          description: Token inválido
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
